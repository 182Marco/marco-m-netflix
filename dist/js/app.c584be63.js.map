<nav>
  <ul>
    <li class="search-item">
      <div v-show="showSearch" class="input-wrap">
        <img
          @click="$emit('open-ai-chat')"
          src="@/assets/img/logoIA.svg"
          :alt="$t('navbar.openAiChat')"
          class="ia-chat-btn"
        />
        <input
          id="searchMovieInput"
          ref="input"
          type="text"
          :placeholder="$t('navbar.searchPlaceholder')"
          v-model.trim="query"
          @keyup="$store.dispatch('getAllData')"
          @focus="onSearchFocus"
          @input="onSearchFocus"
        />
        <button
          v-show="query !== ''"
          type="button"
          class="clear-btn"
          :aria-label="$t('navbar.clearSearch')"
          @click="clearSearch"
        >
          &times;
        </button>
        <LanguageSelector v-model="language" />
      </div>
      <i
        @click="
            putFocus();
            $store.dispatch('changeColNav');
          "
        class="fas fa-search"
      ></i>
    </li>
    <NotificationMenu
      icon="fas fa-gift"
      :label="$t('navbar.gifts')"
      :open="openMenu === 'gift'"
      @toggle="toggleMenu('gift')"
      @close="openMenu = null"
      @select="openSearchFromMenu"
    />
    <NotificationMenu
      icon="fas fa-bell"
      :label="$t('navbar.notifications')"
      :open="openMenu === 'bell'"
      :badge="!bellSeen"
      @toggle="toggleMenu('bell')"
      @close="openMenu = null"
      @select="openSearchFromMenu"
    />
    <li class="tablet">
      <a href="#">
        <img src="@/assets/img/marcoMilza.webp" :alt="$t('navbar.authorAlt')" />
      </a>
    </li>
  </ul>
</nav>
