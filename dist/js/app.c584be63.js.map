<header class="chat-modal-header">
  <nav>
    <div class="nav-left">
      <img
        src="@/assets/img/NetflixScout.png"
        alt="Netflix Scout"
        class="netflix-scout-logo"
      />
    </div>
    <div class="nav-right">
      <button
        type="button"
        class="settings-btn"
        :aria-label="
          settingsOpen ? $t('chat.closeSettings') : $t('chat.openSettings')
        "
        :aria-pressed="settingsOpen ? 'true' : 'false'"
        @click="$emit('toggle-settings')"
      >
        {{ $t('chat.settings') }}
      </button>
      <button type="button" @click="$emit('reset-chat')">
        {{ $t('chat.newChat') }}
      </button>
      <button @click="$emit('close')">{{ $t('chat.closeBot') }}</button>
    </div>
  </nav>
</header>
