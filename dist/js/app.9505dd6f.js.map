<div class="cont">
  <VideoComp
    class="video"
    v-if="showVideo"
    :keyFromApi="key"
    :obj="interstellarObj"
    @close="showVideo = false"
  />
  <img
    v-if="$store.state.showPromo"
    class="promo-img tablet"
    src="@/assets/img/interstellar.avif"
    :alt="$t('promo.alt')"
  />
  <button @click="showVideo = !showVideo" class="close-promo-video">
    <i class="fas fa-play"></i> {{ $t('card.play') }}
  </button>
</div>
