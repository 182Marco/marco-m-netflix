<div class="chat-modal">
  <ChatModalHeader
    :settings-open="isSettingsDrawerOpen"
    @close="handleModalClose"
    @reset-chat="resetChat"
    @toggle-settings="toggleSettingsDrawer"
  />

  <div class="chat-layout" :class="{ 'has-settings': isSettingsDrawerOpen }">
    <SettingsDrawer
      class="chat-settings-drawer"
      :open="isSettingsDrawerOpen"
      :ready="isSettingsReady"
      @toggle="toggleSettingsDrawer"
      @default-click="restoreDefaults"
    >
      <SettingsForm />
    </SettingsDrawer>

    <div class="chat-main">
      <div ref="messagesContainer" class="messages-scroll">
        <div
          v-for="message in messages"
          :key="message.id"
          class="message-row"
          :class="`is-${message.role}`"
        >
          <div v-if="message.role !== 'agent-process'" class="message-bubble">
            <span class="message-time">{{ message.timestamp }}</span>

            <p v-if="message.role === 'user'" class="message-text" dir="auto">
              {{ message.text }}
            </p>
            <div
              v-else-if="message.text"
              class="message-text message-markdown"
              dir="auto"
              v-html="renderMarkdown(message.text)"
            ></div>
            <!-- waiting for the first answer_delta -->
            <div
              v-else
              class="typing-dots"
              role="status"
              :aria-label="$t('chat.working')"
            >
              <span></span><span></span><span></span>
            </div>

            <p
              v-for="source in message.attributions"
              :key="source"
              class="message-attribution"
            >
              {{ source }}
            </p>
          </div>

          <div v-else class="agent-process-bubble">
            <button
              type="button"
              class="accordion-trigger"
              @click="toggleProcess(message.id)"
            >
              <span class="agent-title">{{ $t(message.titleKey) }}</span>

              <img
                src="@/assets/img/chevron.svg"
                :alt="$t('chat.toggleDetails')"
                class="chevron"
                :class="{ rotate: message.isOpen }"
              />
            </button>

            <div
              :ref="`agentContent-${message.id}`"
              class="agent-content"
              :class="{ 'show-accordion': message.isOpen }"
            >
              <template v-for="(entry, index) in message.entries" :key="index">
                <p
                  v-if="entry.kind === 'story'"
                  class="agent-text agent-story"
                  :class="`is-${entry.level}`"
                >
                  <span class="agent-icon">{{ levelIcon(entry.level) }}</span>
                  {{ entry.text }}
                </p>

                <div v-else class="agent-step">
                  <p class="agent-text agent-step-title">{{ entry.title }}</p>
                  <p
                    v-for="(line, lineIndex) in entry.lines"
                    :key="lineIndex"
                    class="agent-text agent-step-line"
                  >
                    {{ line }}
                  </p>
                  <p
                    v-for="(link, linkIndex) in entry.links"
                    :key="`${link.url}-${linkIndex}`"
                    class="agent-text agent-step-line"
                  >
                    <a
                      class="agent-step-link"
                      :href="link.url"
                      target="_blank"
                      rel="noopener noreferrer"
                      >{{ link.label }}</a
                    >
                  </p>
                  <p
                    v-for="source in entry.attributions"
                    :key="source"
                    class="agent-text agent-step-line agent-source"
                  >
                    {{ source }}
                  </p>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>

      <MovieResultsPanel
        v-if="movies.length > 0"
        :items="movies"
        :open="moviesPanelVisible"
        @close="setMoviesPanelVisible(false)"
        @open="setMoviesPanelVisible(true)"
      />

      <div
        v-if="notice"
        class="chat-notice"
        :class="`is-${notice.tone}`"
        role="alert"
      >
        <span class="chat-notice-text">{{ $t(notice.messageKey) }}</span>
        <button
          v-if="failedTurn"
          type="button"
          class="chat-notice-btn"
          @click="retry"
        >
          {{ $t('chat.retry') }}
        </button>
        <button
          v-if="notice.tone !== 'info'"
          type="button"
          class="chat-notice-btn"
          :aria-label="$t('chat.dismiss')"
          @click="clearNotice"
        >
          ✕
        </button>
      </div>

      <div class="chat-input-fixed">
        <div class="chat-input-wrap">
          <input
            id="chatInput"
            ref="input"
            v-model.trim="currentMessage"
            type="text"
            class="chat-input"
            :placeholder="
              $t(isMobile ? 'chat.placeholder.short' : 'chat.placeholder.full')
            "
            :maxlength="maxMessageChars"
            :disabled="isBusy"
            @keyup.enter.prevent="sendMessage"
          />

          <button
            type="button"
            class="send-btn"
            :disabled="isBusy"
            @click="sendMessage"
          >
            <img src="@/assets/img/send.svg" :alt="$t('chat.send')" />
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
