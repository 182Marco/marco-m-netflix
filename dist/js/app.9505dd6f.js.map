<transition name="settings-drawer-slide">
  <aside
    v-if="open"
    class="settings-drawer"
    role="dialog"
    :aria-label="$t('settings.drawer')"
  >
    <header class="settings-drawer-header">
      <button
        type="button"
        class="settings-btn"
        :aria-label="$t('settings.defaultAria')"
        :disabled="!ready"
        @click="$emit('default-click')"
      >
        {{ $t('settings.default') }}
      </button>

      <button
        type="button"
        class="settings-btn"
        :aria-label="$t('settings.applyAria')"
        :disabled="!ready"
        @click="$emit('toggle')"
      >
        {{ $t('settings.apply') }}
      </button>
    </header>

    <div class="settings-drawer-content">
      <slot />
    </div>
  </aside>
</transition>
