<div id="app">
  <div class="appMenu-page">
    <HeaderComp
      @open-ai-chat="openAiChat"
      @go-home="scrollToTop"
      @search-focus="scrollToSearchResults"
    >
      <NavbarLeft :links="linksNavLf" @select="onNavSelect" />
    </HeaderComp>
    <!-- featured movie on jumbo -->
    <PromoMovie />
    <main class="main-content">
      <List
        ref="moviesList"
        :title="$t('list.moviesSearch')"
        v-show="movies.length > 0"
        class="matchingGrupFirst"
      >
        <Card v-for="el in movies" :key="el.id" :obj="el" />
      </List>
      <List
        ref="seriesList"
        :title="$t('list.seriesSearch')"
        v-show="series.length > 0"
      >
        <Card v-for="el in series" :key="el.id" :obj="el" />
      </List>
      <HomeSection
        v-for="sec in homeSections"
        :key="sec.key"
        :section-key="sec.key"
        :eager="!!sec.eager"
      />
      <div ref="myList" class="my-list" :class="{ pulse: myListPulse }">
        <List v-if="isMyListEmpty" :title="$t('nav.myList')">
          <div class="fav-empty">
            <svg class="fav-empty-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2.1 0 3.4 1.2 4 2.2.6-1 1.9-2.2 4-2.2 3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z"
              />
            </svg>
            <p class="fav-empty-title">{{ $t('list.favEmpty') }}</p>
            <p class="fav-empty-hint">{{ $t('list.favEmptyHint') }}</p>
          </div>
        </List>
        <div v-else>
          <List
            :title="$t('list.favMovies')"
            v-show="favouriteMovies.length > 0"
          >
            <Card
              v-for="el in favouriteMovies"
              :key="`favM_${el.id}`"
              :obj="el"
            />
          </List>
          <List
            :title="$t('list.favSeries')"
            v-show="favouriteSeries.length > 0"
          >
            <Card
              v-for="el in favouriteSeries"
              :key="`favS_${el.id}`"
              :obj="el"
            />
          </List>
        </div>
      </div>
    </main>
  </div>

  <transition name="fade-chat-modal">
    <ChatModal v-if="showChatModal" @close="closeAiChat" />
  </transition>

  <AppToggle :chat-open="showChatModal" @toggle="toggleAiChat" />
</div>
