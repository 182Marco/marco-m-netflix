<header class="fillBlack" ref="header" @click="onHeaderClick">
  <div class="cont">
    <div class="wrap-logoNav">
      <img
        class="tablet"
        src="@/assets/img/brand.svg"
        :alt="$t('header.logoAlt')"
      />
      <img
        class="mobile"
        src="@/assets/img/netflix.avif"
        :alt="$t('header.logoAlt')"
      />
      <slot></slot>
    </div>
    <NavbarRight
      @open-ai-chat="$emit('open-ai-chat')"
      @search-focus="$emit('search-focus')"
    />
  </div>
</header>
