<div id="app">
  <div class="appMenu-page">
    <HeaderComp @open-ai-chat="openAiChat">
      <NavbarLeft :links="linksNavLf" />
    </HeaderComp>
    <!-- featured movie on jumbo -->
    <PromoMovie />
    <main class="main-content">
      <List
        :title="$t('list.moviesSearch')"
        v-show="movies.length > 0"
        class="matchingGrupFirst"
      >
        <Card v-for="el in movies" :key="el.id" :obj="el" />
      </List>
      <List :title="$t('list.seriesSearch')" v-show="series.length > 0">
        <Card v-for="el in series" :key="el.id" :obj="el" />
      </List>
      <List :title="$t('list.popularMovies')">
        <Card v-for="el in popularMov" :key="el.id" :obj="el" />
      </List>
      <List :title="$t('list.popularSeries')">
        <Card v-for="el in popularSeries" :key="el.id" :obj="el" />
      </List>
      <List :title="$t('list.favMovies')" v-show="favouriteMovies.length > 0">
        <Card v-for="el in favouriteMovies" :key="`favM_${el.id}`" :obj="el" />
      </List>
      <List :title="$t('list.favSeries')" v-show="favouriteSeries.length > 0">
        <Card v-for="el in favouriteSeries" :key="`favS_${el.id}`" :obj="el" />
      </List>
    </main>
  </div>

  <transition name="fade-chat-modal">
    <ChatModal v-if="showChatModal" @close="closeAiChat" />
  </transition>
</div>
