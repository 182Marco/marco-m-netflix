<div class="cont">
  <VideoComp
    class="video"
    v-if="showVideo"
    :keyFromApi="key"
    :obj="interstellarObj"
  />
  <img
    v-if="$store.state.showPromo"
    class="promo-img tablet"
    src="@/assets/img/interstellar.webp"
    alt="interstellar promo"
  />
  <button @click="showVideo = !showVideo" class="close-promo-video">
    <i class="fas fa-play"></i> Play
  </button>
</div>
