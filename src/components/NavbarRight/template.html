<nav>
  <ul>
    <li class="search-item">
      <Transition name="search-fade">
        <div v-show="showSearch" class="input-wrap">
          <img
            @click="$emit('open-ai-chat')"
            src="@/assets/img/logoIA.svg"
            :alt="$t('navbar.openAiChat')"
            class="ia-chat-btn"
          />
          <input
            id="searchMovieInput"
            ref="input"
            type="text"
            :placeholder="$t('navbar.searchPlaceholder')"
            v-model.trim="query"
            @keyup="$store.dispatch('getAllData')"
            @focus="onSearchFocus"
            @input="onSearchFocus"
          />
          <button
            v-show="query !== ''"
            type="button"
            class="clear-btn"
            :aria-label="$t('navbar.clearSearch')"
            @click="clearSearch"
          >
            &times;
          </button>
          <LanguageSelector v-model="language" />
        </div>
      </Transition>
      <i
        @click="
            putFocus();
            $store.dispatch('changeColNav');
          "
        class="fas fa-search"
      ></i>
    </li>
    <NotificationMenu
      icon="fas fa-bell"
      :label="$t('navbar.notifications')"
      :open="bellOpen"
      :badge="!bellSeen"
      @show="showBell"
      @hide="bellOpen = false"
      @select="openChatFromBell"
    />
    <li class="tablet">
      <a href="#">
        <img src="@/assets/img/marcoMilza.avif" :alt="$t('navbar.authorAlt')" />
      </a>
    </li>
  </ul>
</nav>
