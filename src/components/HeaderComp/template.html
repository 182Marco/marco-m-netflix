<header class="fillBlack" ref="header">
  <div class="cont">
    <div class="wrap-logoNav">
      <img
        class="tablet"
        @click="$emit('go-home')"
        src="@/assets/img/brand.svg"
        :alt="$t('header.logoAlt')"
      />
      <img
        class="mobile"
        @click="$emit('go-home')"
        src="@/assets/img/netflix.png"
        :alt="$t('header.logoAlt')"
      />
      <slot></slot>
    </div>
    <NavbarRight @open-ai-chat="$emit('open-ai-chat')" />
  </div>
</header>
