<section class="movie-results" :class="{ 'is-open': open }">
  <button
    type="button"
    class="results-toggle"
    :aria-expanded="open"
    aria-controls="movie-results-window"
    @click="$emit(open ? 'close' : 'open')"
  >
    <span class="results-title">{{ $t('results.title') }}</span>
    <span class="results-count">{{ items.length }}</span>
    <img src="@/assets/img/chevron.svg" alt="" class="chevron" />
  </button>

  <transition name="results-collapse">
    <div
      v-show="open"
      id="movie-results-window"
      class="results-window"
      role="region"
      :aria-label="$t('results.region')"
    >
      <List>
        <template v-for="item in items" :key="item.key">
          <Card v-if="isCard(item)" :obj="item" compact />
          <VideoResultTile v-else :item="item" />
        </template>
      </List>
    </div>
  </transition>
</section>
