<header class="chat-modal-header">
  <nav>
    <div class="nav-left">
      <img
        src="@/assets/img/NetflixScout.png"
        alt="Netflix Scout"
        class="netflix-scout-logo"
      />
    </div>
    <div class="nav-right">
      <button
        type="button"
        class="settings-btn"
        :aria-label="settingsOpen ? 'Close settings' : 'Open settings'"
        :aria-pressed="settingsOpen ? 'true' : 'false'"
        @click="$emit('toggle-settings')"
      >
        settings
      </button>
      <button type="button" @click="$emit('reset-chat')">
        new chat
      </button>
      <button @click="$emit('close')">close bot</button>
    </div>
  </nav>
</header>
