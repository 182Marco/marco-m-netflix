<div v-if="renderVideo" class="wrap">
  <CloseXButton
    v-show="showXclose"
    class="video-close-btn"
    color="#fff"
    hoverColor="#fff"
    size="2rem"
    @click="renderVideo = !renderVideo"
  />
  <iframe
    :src="`https://www.youtube.com/embed/${keyFromApi}${playWhenCreated}`"
    :title="obj.title ? obj.title : obj.name"
    frameborder="0"
    allowfullscreen
    allow="autoplay"
  ></iframe>
</div>
